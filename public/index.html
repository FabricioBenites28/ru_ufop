<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>RU UFOP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">🍽️</span>
      <div>
        <div class="brand-name">RU UFOP</div>
        <div class="brand-sub">quem vai comer?</div>
      </div>
    </div>
    <span id="status" class="badge">…</span>
  </header>

  <main>
    <section id="timeline"></section>
    <div id="empty" class="empty hidden">
      <div class="empty-emoji">🍃</div>
      <p>Ninguém anunciou ainda.</p>
      <p class="sub">Seja a primeira pessoa a avisar que vai ao RU!</p>
    </div>
  </main>

  <button id="announceBtn" class="fab">➕ Anunciar</button>

  <div id="emailOverlay" class="overlay center">
    <div class="card auth">
      <div class="auth-icon">🍽️</div>
      <h1>Bem-vindo ao RU</h1>
      <p class="sub">Entre com seu e-mail da UFOP.<br>Assim todos sabem quem vai comer.</p>
      <input id="emailInput" type="email" placeholder="nome@aluno.ufop.edu.br" autocomplete="email" autocapitalize="off" spellcheck="false">
      <div id="emailError" class="error hidden">Digite um e-mail válido da UFOP<br>(…@aluno.ufop.edu.br)</div>
      <button id="emailOk" class="primary">Continuar</button>
    </div>
  </div>

  <div id="modal" class="overlay">
    <div class="sheet">
      <div class="sheet-grab"></div>
      <h2>Vou comer no RU…</h2>
      <div class="tabs">
        <button id="tabIn" class="tab active">Em quanto tempo?</button>
        <button id="tabExact" class="tab">Hora exata</button>
      </div>

      <div id="panelIn" class="panel">
        <div class="chips" id="chips"></div>
      </div>

      <div id="panelExact" class="panel hidden">
        <input type="time" id="exactTime" value="19:00">
      </div>

      <div class="preview" id="preview"></div>

      <div class="actions">
        <button id="cancelBtn" class="ghost">Cancelar</button>
        <button id="confirmBtn" class="primary">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
